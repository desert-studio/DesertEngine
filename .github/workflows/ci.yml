# Desert Engine CI — build (Debug + Release) and run the full test suite on Apple Silicon macOS.
# Tests are auto-enabled on CI: Desert/premake5.lua checks the CI env var (GitHub always sets it).
name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
  workflow_dispatch:

# A PUSH gets its own run and keeps it. A PULL REQUEST keeps only its latest.
#
# This used to be one group per branch, so any push to `dev` cancelled whatever was still running —
# and the cost was not runner time, it was evidence. Integrating several merges in a session meant
# each push killed the verification of the one before it, and a cancelled job reports as `cancelled`
# rather than `failure`, so nothing looks wrong. On 2026-09-05 that pattern cost a full merge's worth
# of Windows coverage before anyone noticed.
#
# `cancel-in-progress: false` alone would NOT have fixed it: with the same group, runs queue instead
# of cancelling, so the second push simply waits out the first — the same hour, spent differently.
# The fix is the group key. On `push` it is the commit, so every pushed commit is verified
# independently and in parallel; on `pull_request` it stays the ref, so pushing a fixup to a PR still
# cancels the previous attempt, which is what you want while iterating.
#
# Affordable because this repository is PUBLIC: GitHub Actions minutes on standard runners are free
# and unmetered for public repos, so the only thing extra runs cost is concurrency, and this branch
# sees single-digit runs a day. If the repository ever goes private, Windows bills at 2x and macOS at
# 10x, and this decision has to be taken again with a bill attached.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Pinned so a LunarG release cannot silently change what Windows builds against. Bump deliberately.
  VULKAN_SDK_VERSION: "1.3.290.0"

jobs:
  # Style gate: only the LINES CHANGED by this push/PR must satisfy .clang-format (legacy files
  # converge as they get touched — a full-tree gate would fail on pre-config code forever).
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base needs history
          # ...but merge-base needs COMMITS AND TREES, not file contents, and this repository carries
          # over half a gigabyte of verification screenshots (Docs/Clouds/Shots alone). A full-history
          # clone stopped fitting in this job's ten minutes on 2026-08-27: the run spent the entire
          # budget inside actions/checkout, never reached clang-format at all, and GitHub reports a
          # timeout as "cancelled". Windows and macOS both `needs: format`, so they were SKIPPED --
          # three merges landed with no build validation and a status that did not look like failure.
          # blob:none fetches blobs lazily, so CheckFormat.sh pulls only the .cpp/.hpp it actually
          # diffs. Removing this restores the timeout, and the timeout looks like a cancellation.
          filter: blob:none

      # PINNED TO 18, AND THE PIN IS THE POINT. This step used to install the unversioned
      # `clang-format` package, i.e. whatever the runner image happens to ship — so the gate's verdict
      # changed silently whenever GitHub rebuilt the image, and it was not comparable to anything a
      # developer could run. Every developer here verifies with Homebrew's llvm@18
      # (`git-clang-format --binary /opt/homebrew/opt/llvm@18/bin/clang-format`), which is also what
      # the contract and the verify skill tell them to use.
      #
      # MEASURED 2026-09-08: a merge whose changed lines were clean under 18 locally was REJECTED here,
      # on a string-literal concatenation the newer formatter re-wraps differently. Nothing was wrong
      # with the code; the two ends of the gate were different programs. An unpinned formatter is the
      # same defect class as an unpinned compiler — the answer depends on the day.
      #
      # If this ever needs to move, move it deliberately and in ONE change: this line, the skill
      # (`desert-engine-verify` §6), the contract (§3.3), and a re-format of the tree under the new
      # version. Do not let the two ends drift apart again.
      # The package is versioned; CheckFormat.sh looks for `clang-format-18` by name and passes it to
      # git-clang-format with --binary, so no PATH alias is needed. The first attempt at this pin used
      # update-alternatives and left NO plain `clang-format` on PATH at all — git then printed "not a
      # git command", which the old script reported as formatting violations. That is why the script
      # now distinguishes "could not run" (exit 2) from "found violations" (exit 1).
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18

      - name: Check formatting of changed lines
        run: ./scripts/CI/CheckFormat.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Static analysis gate: the LINES CHANGED by this push/PR must be clean under clang-tidy.
  #
  # WHY CHANGED LINES AND NOT THE TREE, with the number behind it: measured on this commit, the check
  # set in .clang-tidy reports 727 689 diagnostics over the 565 translation units of the workspace
  # (67 406 distinct source locations once a header seen from many units is counted once). A whole-tree gate would be red on its first run and on every
  # run after it, so it would be switched off — which is precisely the state this task found the
  # repository's .clang-tidy in, unrun since 27 July. The format gate made the same call for the same
  # reason and the tree has converged under it ever since: code you TOUCH becomes clean.
  #
  # ITS OWN JOB, AND NOT `needs:` ANYTHING. It is deliberately off the critical path: Windows already
  # measures 73-93 minutes against its 150-minute ceiling and has been cancelled by its own timeout
  # twice, and the macOS sanitizers job sits at 61-73 % of its own. This job neither gates them nor is
  # gated by them, so its verdict is separable and its minutes are spent in parallel.
  #
  # macOS AND NOT ubuntu, unlike the format gate, and the reason is the same pin that puts the
  # formatter on 18. clang-tidy analyses a TRANSLATION UNIT, so its verdict depends on the platform's
  # system headers and on which side of every `#ifdef __APPLE__` the code falls. A Linux runner would
  # analyse a different program from the one any developer here can reproduce, and a gate whose
  # findings cannot be reproduced locally is a gate that gets argued with instead of fixed. Every
  # developer on this project runs Homebrew's llvm@18 already (the formatter lives in the same keg).
  tidy:
    name: clang-tidy (changed lines)
    runs-on: macos-14 # Apple Silicon — the platform whose headers the developers' verdict comes from
    # Measured on a developer machine: premake + the compile database is 40 s and the analysis itself
    # is ~13 s of CPU per translation unit, so the cost here is set by how many files a push touches,
    # not by the size of the tree. The rest is Homebrew. 45 minutes is roughly three times the
    # observed run and is a ceiling rather than a budget; if it is ever approached, the reason will be
    # a push touching a hundred files, which is worth noticing rather than absorbing.
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive # premake enumerates ThirdParty; a missing submodule is a missing makefile
          fetch-depth: 0 # merge-base needs history
          filter: blob:none # ...and not the half-gigabyte of verification screenshots in it

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tidy-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      # llvm@18 IS NOT INSTALLED BY Setup.sh UNDER CI, deliberately and with a measurement behind it:
      # it is a ~1.5 GB bottle that the build jobs never invoke, and the sanitizers job cannot afford
      # it. This is the one job that does, so it pays for it here rather than making every macOS job
      # pay. Keg-only, so nothing is linked into PATH — CheckTidy.sh looks for the binary by its
      # absolute path, exactly as CheckFormat.sh does for the formatter.
      - name: Install clang-tidy 18
        run: brew install llvm@18

      # THE DATABASE COMES FROM THE BUILD, BY THE BUILD'S OWN COMMAND. --gen-only stops after
      # `premake5 gmake2`, which is the same generation step a normal build runs; CheckTidy.sh then
      # asks those makefiles, in dry run, what they would compile. Nothing here is a second opinion
      # about the build's flags that could drift from them.
      - name: Generate project files
        run: ./scripts/MacOS/BuildMacOS.sh Debug --gen-only

      - name: clang-tidy the changed lines
        run: ./scripts/CI/CheckTidy.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Dynamic checks: the whole workspace builds with ASan+UBSan (the premake makefiles append
  # env CXXFLAGS/LDFLAGS) and the full test suite runs under them. Leak detection stays off —
  # LSan is unsupported on Apple Silicon.
  sanitizers:
    name: ASan+UBSan tests
    runs-on: macos-14
    # Measured 2026-09-05 over the last five green runs: 55, 59, 60, 60 and 66 minutes — 61 % to 73 % of
    # this budget. NOT raised, deliberately: Windows was raised because it had already been cancelled
    # twice, and raising a ceiling nobody has hit is how you stop noticing that a job is growing. This
    # one IS growing (every new suite lands here first, and the suite count went 95 -> 97 today), and it
    # gates `macos` below, so a timeout here does not fail macOS Release — it SKIPS it, which reports as
    # nothing being wrong. Watch the margin; when it reaches Windows's 80 %+, raise it or split the job.
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # THE BUILD NUMBER NEEDS HISTORY, and actions/checkout's default is depth 1. `git rev-list
          # --count HEAD` answers **1** in a shallow clone, so every artifact this workflow has ever
          # produced carried "0.1.1+<hash>" — a build number that looks like a number and is not one.
          # scripts/GenVersion.sh now DETECTS the shallow case and emits no build number at all rather
          # than that lie, which is honest but leaves the artifact without an identity the launcher can
          # gate a collection on (L2 design §4.4). So: full commit history, blobs fetched lazily — the
          # same `filter` the format job above uses, and for the same reason (Docs/Clouds/Shots alone is
          # over half a gigabyte of history nobody here needs). Commits and trees are cheap; it is the
          # historical blobs that are not, and a build only ever touches the checked-out ones.
          fetch-depth: 0
          filter: blob:none

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      - name: Build Debug with sanitizers
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
        run: ./scripts/MacOS/BuildMacOS.sh Debug

      - name: Run tests under sanitizers
        env:
          # detect_container_overflow=0: the third-party libs (yaml-cpp, Jolt, Lua, reflect-cpp, ...) are
          # built WITHOUT the sanitizer, so std::vector/string annotations are inconsistent across the ABI
          # boundary and ASan false-fires "container-overflow" in wrap_memcpy. Real OOB detection stays on.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:detect_container_overflow=0"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ./scripts/MacOS/RunTests.sh "$PWD" Debug

  # The Release build, test run, shader lint and packaging only run AFTER both gates pass — no point
  # spending a macOS build on code that fails formatting or trips a sanitizer. (format = static;
  # sanitizers = DYNAMIC: it must build instrumented and RUN the suite to catch memory/UB at runtime,
  # so it necessarily compiles + tests Debug — that is the check, not a duplicate of this job. Debug is
  # therefore already covered there, so this job only builds Release + shader lint + the artifact.)
  macos:
    name: macOS ${{ matrix.config }}
    needs: [ format, sanitizers ]
    runs-on: macos-14 # Apple Silicon (arm64) — matches the supported platform
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Debug is already built AND tested by the `sanitizers` job (under ASan+UBSan, which is
        # stricter), so this matrix only needs Release — that removes a whole duplicate Debug build.
        config: [Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full commit history, blobs lazily — see the note on the sanitizers job's checkout. This is
          # the job that PACKAGES the Release artifact, so it is the one whose build number is shipped.
          fetch-depth: 0
          filter: blob:none

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      # Idempotent: installs brew packages + fetches non-submodule third-party (optick, volk,
      # reflect-cpp sources). Submodules are already in place from the checkout.
      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      - name: Build ${{ matrix.config }}
        run: ./scripts/MacOS/BuildMacOS.sh ${{ matrix.config }}

      - name: Run tests
        run: ./scripts/MacOS/RunTests.sh "$PWD" ${{ matrix.config }}

      # Offline shader lint: every .shader parses with the SAME DShaderParser the engine uses —
      # a broken shader fails the pipeline here instead of the editor at runtime.
      - name: Lint shaders (DShaderTool)
        run: ./build/Bin/${{ matrix.config }}/DShaderTool Editor/Resources/Shaders

      # Surface the test reports even when a step above failed.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.config }}
          path: build/TestReports/
          if-no-files-found: ignore

      # THE ENGINE DROP: the editor + the tools + the loose engine resources they read. NOT a game —
      # a game is packaged by the editor's own PackageGame(), which needs an open project that CI does
      # not have. Release only; a Debug artifact would be huge and unused.
      #
      # This comment used to say "binaries + Content.dpak (built with the same PakTool the Runtime
      # mounts) + loose Resources", and П5 measured that claim false on 2026-09-08: the pak's only
      # possible reader was the Runtime beside it, and that Runtime mounted 144 MB and then refused,
      # because a pak of Editor/Resources carries no project descriptor. The pak and its manifest are
      # gone from both platform scripts, and the artifact went 528 -> 384 MB — 52 % of it had been one
      # tree shipped twice. Three places asserted the same wrong thing (both scripts and this line);
      # if a fourth appears, it is the same defect, not a new one.
      - name: Package build
        if: matrix.config == 'Release'
        run: ./scripts/MacOS/Package.sh Release

      - name: Upload packaged build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: DesertEngine-macOS-Release
          path: dist/DesertEngine-Release/
          retention-days: 14

  # Windows is a SUPPORTED target, not an afterthought: the engine is developed on it, yet nothing here
  # compiled it, so MSVC-only breakage (object-file section limits, the <windows.h> min/max macros, CRT
  # mismatches between static libs, wide-string filesystem paths) reached the branch unnoticed. Depends
  # only on `format`, not on the macOS-specific `sanitizers` job, so Windows feedback is not gated behind
  # it — which matters more than it did when this was written: that job said "a 15-minute macOS run" and
  # `sanitizers` now takes 55 to 66 minutes (measured 2026-09-05 over the last five green runs). The
  # decision was right; only its stated price was a year out of date.
  windows:
    name: Windows ${{ matrix.config }}
    needs: [ format ]
    runs-on: windows-latest
    # 150, not 90, and the margin is the point. Measured 2026-09-05 over the last four green runs,
    # Windows Debug takes 73, 73, 76 and 84 minutes — 81 % to 93 % of a 90-minute budget. Twice it went
    # over and GitHub cancelled it, at ~90 minutes each time (runs 33915939489 and 33940280564).
    #
    # Then the very next run settled it: 33958917578 took 93 min 39 s and PASSED. Under the old ceiling
    # that green run would have been cancelled instead, and cancelled reports as nothing being wrong.
    #
    # A cancelled job is the worst of the three outcomes, worse than a red one: it reports as
    # "cancelled", not "failure", so nothing looks broken while the platform that diverges MOST from
    # macOS — windows.h macros eating method names, wide-string path::native(), Release-only float
    # cancellation — quietly produces no evidence at all. Raising the ceiling stops losing evidence
    # today; it does not make the build faster, and the growth is real (the vertex-path split added
    # shaders and is the likeliest cause of the first cancellation). Cutting the build time is its own
    # task; until it lands, this number must stay well clear of the measured duration.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Both configurations on purpose. Debug is what the engine is developed in and is where the
        # section-count and Debug-CRT problems live; Release is what ships and is where optimizer- and
        # NDEBUG-only breakage would hide.
        config: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full commit history, blobs lazily — see the note on the sanitizers job's checkout. Windows
          # packages the Release artifact too, and it is also where the BuildVersion suite proves the
          # header agrees with git on a platform no developer here can run.
          fetch-depth: 0
          filter: blob:none

      # The engine links shaderc*.lib and spirv-cross-*.lib out of the SDK's Lib directory, so a
      # headers-only Vulkan install is not enough — this is the real LunarG SDK. Pinned so a new SDK
      # release cannot change the build under us, and cached because it is a ~200 MB download.
      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          # The suffix is part of the key because the cache stores an INSTALL, not a download: a cached
          # tree built without the debug component would make the install step below skip, and the
          # component would never appear. Change the component set -> change this suffix.
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-debuglibs

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ env.VULKAN_SDK_VERSION }}"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan.exe"
          # com.lunarg.vulkan.debug — the "Debuggable Shader API Libraries", which is where the debug
          # halves of the shader libs (shadercd.lib and friends) live. It is an OPTIONAL component, and
          # a bare `install` with --default-answer takes the core only, so the Debug configuration
          # linked against a shadercd.lib that was never installed. The cache key above carries the
          # component set for exactly this reason — see the note on it.
          & "$env:RUNNER_TEMP\vulkan.exe" --root "C:\VulkanSDK\$ver" --accept-licenses `
              --default-answer --confirm-command install com.lunarg.vulkan.debug
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }

      - name: Export VULKAN_SDK
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) { throw "Vulkan SDK missing at $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Same script a developer runs: fetches the non-submodule third-party (optick, meshoptimizer),
      # and generates the VS solution. (It no longer writes Version.gen.hpp — the build does, through
      # Common.vcxproj's PreBuildEvent.) Running it here means the documented
      # setup path is itself under test — a broken Setup.bat fails CI instead of the next new machine.
      - name: Setup dependencies + generate projects
        shell: cmd
        run: scripts\Windows\Setup.bat

      - name: Build ${{ matrix.config }}
        shell: cmd
        run: msbuild Desert.sln -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m -v:minimal

      # run_tests.bat is generated by premake (Desert/Tests/premake5.lua); tests are enabled because
      # GitHub always sets CI, which Desert/premake5.lua checks.
      - name: Run tests
        shell: cmd
        run: run_tests.bat

      # Offline shader lint with the SAME DShaderParser the engine uses — mirrors the macOS job.
      - name: Lint shaders (DShaderTool)
        shell: cmd
        run: build\Bin\${{ matrix.config }}\DShaderTool.exe Editor\Resources\Shaders

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows-${{ matrix.config }}
          path: build/TestReports/
          if-no-files-found: ignore

      - name: Package build
        if: matrix.config == 'Release'
        shell: cmd
        run: scripts\Windows\Package.bat Release

      - name: Upload packaged build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: DesertEngine-Windows-Release
          path: dist/DesertEngine-Release/
          retention-days: 14
