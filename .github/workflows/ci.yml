# Desert Engine CI — build every configuration the workspace declares (Debug, Release and Shipping)
# and run the full test suite. The suite runs in Debug and Release only; `Shipping` has no test
# projects in it by construction (Desert/Tests/premake5.lua), and what proves IT is a compile on both
# platforms plus a symbol dump of the linked player binary (scripts/CI/ShippingSymbols.sh).
# Tests are auto-enabled on CI: Desert/premake5.lua checks the CI env var (GitHub always sets it).
name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      # CCACHE_DEBUG for comparing two runs' hash inputs: Windows Shipping and macOS ASan write
      # ccache's per-object debug files and upload one Common and one Desert object's
      # .ccache-input-text/.ccache-log as an artifact (`ccache-debug-<job>`). Run it twice on the
      # same commit and diff the two artifacts: the line that differs is the input that makes an
      # unchanged first-party translation unit miss (CI-SPEED analysis: every one of ours misses on
      # every run, every vendored one hits). The workflow_dispatch run never saves a cache.
      ccache_debug:
        description: "ccache debug files (Windows Shipping + macOS ASan) as artifacts"
        type: boolean
        default: false

# A PUSH gets its own run and keeps it. A PULL REQUEST keeps only its latest.
#
# This used to be one group per branch, so any push to `dev` cancelled whatever was still running —
# and the cost was not runner time, it was evidence. Integrating several merges in a session meant
# each push killed the verification of the one before it, and a cancelled job reports as `cancelled`
# rather than `failure`, so nothing looks wrong. On 2026-09-05 that pattern cost a full merge's worth
# of Windows coverage before anyone noticed.
#
# `cancel-in-progress: false` alone would NOT have fixed it: with the same group, runs queue instead
# of cancelling, so the second push simply waits out the first — the same hour, spent differently.
# The fix is the group key. On `push` it is the commit, so every pushed commit is verified
# independently and in parallel; on `pull_request` it stays the ref, so pushing a fixup to a PR still
# cancels the previous attempt, which is what you want while iterating.
#
# Affordable because this repository is PUBLIC: GitHub Actions minutes on standard runners are free
# and unmetered for public repos, so the only thing extra runs cost is concurrency, and this branch
# sees single-digit runs a day. If the repository ever goes private, Windows bills at 2x and macOS at
# 10x, and this decision has to be taken again with a bill attached.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Pinned so a LunarG release cannot silently change what Windows builds against. Bump deliberately.
  VULKAN_SDK_VERSION: "1.3.296.0"

jobs:
  # Style gate: only the LINES CHANGED by this push/PR must satisfy .clang-format (legacy files
  # converge as they get touched — a full-tree gate would fail on pre-config code forever).
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base needs history
          # ...but merge-base needs COMMITS AND TREES, not file contents, and this repository carries
          # over half a gigabyte of verification screenshots (Docs/Clouds/Shots alone). A full-history
          # clone stopped fitting in this job's ten minutes on 2026-08-27: the run spent the entire
          # budget inside actions/checkout, never reached clang-format at all, and GitHub reports a
          # timeout as "cancelled". Windows and macOS both `needs: format`, so they were SKIPPED --
          # three merges landed with no build validation and a status that did not look like failure.
          # blob:none fetches blobs lazily, so CheckFormat.sh pulls only the .cpp/.hpp it actually
          # diffs. Removing this restores the timeout, and the timeout looks like a cancellation.
          filter: blob:none

      # PINNED TO 18, AND THE PIN IS THE POINT. This step used to install the unversioned
      # `clang-format` package, i.e. whatever the runner image happens to ship — so the gate's verdict
      # changed silently whenever GitHub rebuilt the image, and it was not comparable to anything a
      # developer could run. Every developer here verifies with Homebrew's llvm@18
      # (`git-clang-format --binary /opt/homebrew/opt/llvm@18/bin/clang-format`), which is also what
      # the contract and the verify skill tell them to use.
      #
      # MEASURED 2026-09-08: a merge whose changed lines were clean under 18 locally was REJECTED here,
      # on a string-literal concatenation the newer formatter re-wraps differently. Nothing was wrong
      # with the code; the two ends of the gate were different programs. An unpinned formatter is the
      # same defect class as an unpinned compiler — the answer depends on the day.
      #
      # If this ever needs to move, move it deliberately and in ONE change: this line, the skill
      # (`desert-engine-verify` §6), the contract (§3.3), and a re-format of the tree under the new
      # version. Do not let the two ends drift apart again.
      # The package is versioned; CheckFormat.sh looks for `clang-format-18` by name and passes it to
      # git-clang-format with --binary, so no PATH alias is needed. The first attempt at this pin used
      # update-alternatives and left NO plain `clang-format` on PATH at all — git then printed "not a
      # git command", which the old script reported as formatting violations. That is why the script
      # now distinguishes "could not run" (exit 2) from "found violations" (exit 1).
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18

      - name: Check formatting of changed lines
        run: ./scripts/CI/CheckFormat.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      # Text is formatted, never glued (owner 2026-09-29): the same changed lines, the same base, must not
      # build text with `+` on a string literal -- std::format / format_to instead. Exit 2 = could not run.
      - name: Check changed lines for glued text
        run: ./scripts/CI/CheckGluedText.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      # Every third-party header must live in THIS repository. TextureBinary.cpp once included
      # <fmt/format.h>, which no checkout contains -- it resolved only from the author's Homebrew
      # prefix, compiled in every local sweep, and broke AssetEviction and AssetMissingFile the first
      # time a machine without it tried. This runs on ubuntu with no Homebrew, which is the point:
      # the gate must not be able to satisfy itself from the runner's own disk.
      - name: Repo-only includes
        run: ./scripts/CI/RepoOnlyIncludes.sh

      # The ported UE GeometryCore (Engine/Geometry/MeshCore) is reached only through the Geometry adapters;
      # a new direct include from anywhere else must be a named, reasoned row of the gate's allow-list.
      - name: MeshCore includes
        run: ./scripts/CI/MeshCoreIncludes.sh

      # A standard symbol must be answered for by THIS repository's text. `sky_panorama_test.cpp`
      # called std::clamp with only <cmath> included: libc++ reaches <algorithm> from there and MSVC
      # does not, so it compiled on every developer machine and failed on Windows Debug -- and it sat
      # invisible for days because the format gate was red and Windows `needs:` it. No compiler on a
      # macOS machine can see this class, so the gate asks the SOURCE TEXT instead, and asks `git
      # ls-files` rather than the disk. Here, on ubuntu, for the same reason the step above is here:
      # neither Homebrew nor MSVC exists on this runner, so it cannot answer from a local prefix.
      # Exit 2 means it could not look, which is a different answer from "I found nothing".
      - name: Standard includes
        run: python3 ./scripts/CI/StandardIncludes.py

  # Static analysis gate: the LINES CHANGED by this push/PR must be clean under clang-tidy.
  #
  # WHY CHANGED LINES AND NOT THE TREE, with the number behind it: measured on this commit, the check
  # set in .clang-tidy reports 727 689 diagnostics over the 565 translation units of the workspace
  # (67 406 distinct source locations once a header seen from many units is counted once). A whole-tree gate would be red on its first run and on every
  # run after it, so it would be switched off — which is precisely the state this task found the
  # repository's .clang-tidy in, unrun since 27 July. The format gate made the same call for the same
  # reason and the tree has converged under it ever since: code you TOUCH becomes clean.
  #
  # ITS OWN JOB, AND NOT `needs:` ANYTHING. It is deliberately off the critical path: Windows already
  # measures 73-93 minutes against its 150-minute ceiling and has been cancelled by its own timeout
  # twice, and the macOS sanitizers job sits at 61-73 % of its own. This job neither gates them nor is
  # gated by them, so its verdict is separable and its minutes are spent in parallel.
  #
  # macOS AND NOT ubuntu, unlike the format gate, and the reason is the same pin that puts the
  # formatter on 18. clang-tidy analyses a TRANSLATION UNIT, so its verdict depends on the platform's
  # system headers and on which side of every `#ifdef __APPLE__` the code falls. A Linux runner would
  # analyse a different program from the one any developer here can reproduce, and a gate whose
  # findings cannot be reproduced locally is a gate that gets argued with instead of fixed. Every
  # developer on this project runs Homebrew's llvm@18 already (the formatter lives in the same keg).
  #
  # ── SHARDED, BECAUSE ONE JOB STOPPED FITTING ─────────────────────────────────────────────────────
  # CI 37580217727: 254 changed files (127 units + headers) against fca6befab, cancelled at 43 minutes
  # inside the analysis step; int/b2 and the previous int/rdg2 ended the same way. An integration
  # branch is routinely more than one job of work. Same three-part shape as CI12 below, with one
  # difference: there N is fixed from recorded timings, here it is the size of THIS push, so a plan job
  # sizes the matrix first.
  #   tidy-plan     ubuntu, seconds: `CheckTidy.sh --plan` counts the changed files with the same
  #                 function the shards split them with, and emits N and the matrix;
  #   tidy          a matrix of N macOS shards, each `CheckTidy.sh --shard I/N` (its files AND its
  #                 share of the register); skipped when nothing C++ changed (N = 0);
  #   tidy-verdict  carries the check name the single job had, "clang-tidy (changed lines)".
  tidy-plan:
    name: clang-tidy plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout (history, no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base needs history
          filter: blob:none # --name-only needs trees, not blobs

      - name: Plan the shards
        id: plan
        run: ./scripts/CI/CheckTidy.sh --plan "${{ github.event.pull_request.base.sha || github.event.before }}" >> "$GITHUB_OUTPUT"

  tidy:
    name: clang-tidy ${{ matrix.shard }}/${{ needs.tidy-plan.outputs.shards }}
    needs: [ tidy-plan ]
    if: needs.tidy-plan.outputs.shards != '0'
    runs-on: macos-14 # Apple Silicon — the platform whose headers the developers' verdict comes from
    strategy:
      fail-fast: false # every shard's findings are reported, not only the first red one's
      matrix:
        shard: ${{ fromJSON(needs.tidy-plan.outputs.matrix) }}
    # Measured on a developer machine: premake + the compile database is 40 s and the analysis itself
    # is ~13 s of CPU per translation unit, so the cost here is set by how many files a push touches,
    # not by the size of the tree. The rest is Homebrew. 45 minutes is roughly three times the
    # observed run and is a ceiling rather than a budget; if it is ever approached, the reason will be
    # a push touching a hundred files, which is worth noticing rather than absorbing.
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive # premake enumerates ThirdParty; a missing submodule is a missing makefile
          fetch-depth: 0 # merge-base needs history
          filter: blob:none # ...and not the half-gigabyte of verification screenshots in it

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tidy-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      # Written by a push to dev only — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job.
      - name: Save Homebrew downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.brew-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tidy-${{ hashFiles('scripts/MacOS/Setup.sh') }}

      # llvm@18 IS NOT INSTALLED BY Setup.sh UNDER CI, deliberately and with a measurement behind it:
      # it is a ~1.5 GB bottle that the build jobs never invoke, and the sanitizers job cannot afford
      # it. This is the one job that does, so it pays for it here rather than making every macOS job
      # pay. Keg-only, so nothing is linked into PATH — CheckTidy.sh looks for the binary by its
      # absolute path, exactly as CheckFormat.sh does for the formatter.
      - name: Install clang-tidy 18
        run: brew install llvm@18

      # THE DATABASE COMES FROM THE BUILD, BY THE BUILD'S OWN COMMAND. --gen-only stops after
      # `premake5 gmake2`, which is the same generation step a normal build runs; CheckTidy.sh then
      # asks those makefiles, in dry run, what they would compile. Nothing here is a second opinion
      # about the build's flags that could drift from them.
      - name: Generate project files
        run: ./scripts/MacOS/BuildMacOS.sh Debug --gen-only

      - name: clang-tidy the changed lines
        run: ./scripts/CI/CheckTidy.sh --shard "${{ matrix.shard }}/${{ needs.tidy-plan.outputs.shards }}" "${{ github.event.pull_request.base.sha || github.event.before }}"

  tidy-verdict:
    name: clang-tidy (changed lines)
    needs: [ tidy-plan, tidy ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The plan must have run; the shards must all pass, or be skipped because the plan found no
      # C++ change (N = 0). A skipped `tidy` with N > 0 means the matrix never ran, which is not a pass.
      - name: The plan and every shard passed
        env:
          PLAN: ${{ needs.tidy-plan.result }}
          SHARDS: ${{ needs.tidy-plan.outputs.shards }}
          TIDY: ${{ needs.tidy.result }}
        run: |
          echo "plan: $PLAN (shards: ${SHARDS:-?}), shards: $TIDY"
          [ "$PLAN" = success ] || { echo "::error::the clang-tidy plan ended '$PLAN'"; exit 1; }
          if [ "$SHARDS" = 0 ]; then
            [ "$TIDY" = skipped ] || { echo "::error::no C++ changed, yet the shards ended '$TIDY'"; exit 1; }
            echo "no C++ files changed — nothing to analyse"
            exit 0
          fi
          [ "$TIDY" = success ] || { echo "::error::a clang-tidy shard ended '$TIDY'"; exit 1; }

  # Dynamic checks: the whole workspace builds with ASan+UBSan (the premake makefiles append
  # env CXXFLAGS/LDFLAGS) and the full test suite runs under them. Leak detection stays off —
  # LSan is unsupported on Apple Silicon.
  # ── CI12: BUILD ONCE, TEST IN SHARDS ─────────────────────────────────────────────────────────────
  # Run #900 (36426811427): this job built for 47 min, then ran 354 suites for 41 min and was cancelled
  # at its 90-minute ceiling; Windows Debug built for 57 min and then tested for 29 on the same runner.
  # Every sanitizer and Windows test configuration is now three kinds of job:
  #   <build>   compiles, plans the shards (scripts/CI/TestShards.py over the SAME expected-suite list
  #             the unsharded runner used) and uploads the test binaries once, as an artifact;
  #   <tests>   a matrix of N shards; each downloads the bundle and runs its own list. No compiler runs
  #             here, so re-running one failed shard costs minutes, not a rebuild;
  #   <verdict> carries the check name the single job used to have ("ASan+UBSan tests", "Windows Debug",
  #             "Windows Release") and is green only if the build and every shard are, AND every
  #             expected suite left exactly one report in the shard it was planned in.
  # N comes from the recorded suite-seconds (scripts/CI/TestTimings.tsv): ASan 6978 over 3 cores, floor
  # JsonCensus 749 s -> 3 shards; Windows Debug 6008 over 4 cores, floor ShaderCacheKey 577 s -> 3
  # shards; Windows Release 440 in total -> 1 shard (a second one would cost more in download than
  # it saves in tests, but the one shard still makes a red test re-runnable without the 100-min build).
  sanitizers:
    name: ASan+UBSan build
    runs-on: macos-14
    # 90, UNCHANGED, and the number was re-argued rather than inherited. On 2026-09-23 this job crossed
    # it (run 35802378535, 1 h 30 m 24 s) after 61, 79 and 79 minutes on the three runs before it, and
    # the crossing reports as `cancelled` — which reads as nothing being wrong while `macos` below is
    # SKIPPED and the repository has no sanitizer coverage at all.
    #
    # THE CREEP WAS NOT WHAT IT LOOKED LIKE. Those four runs are four near-identical commits (two of
    # them formatting-only) and they differ by TWO test suites, 277 -> 279. The same suites took 1.27x
    # to 1.57x longer on the slow runs than on the fast one — CloudField 397 s -> 521 s, CloudType
    # 251 s -> 394 s — at the same -j3 on the same runner label. Most of "61 -> 90" is macos-14 runner
    # speed, not work this repository added; the four suites that landed that day (GizmoIconSet,
    # ViewportCameraPreset, ProceduralEnvironmentCube, TextureCompressionBC) were not in ANY of the four
    # runs, having landed after the last of them.
    #
    # WHAT CHANGED is on the test side of the job, not here: the sweep ran 279 suites strictly one after
    # another on a THREE-core runner, 40.1 minutes with two cores idle, 71.7 % of it inside ten suites.
    # scripts/MacOS/RunTests.sh now runs them concurrently — see its header for the distribution.
    #
    # WHAT THAT BOUGHT, measured end to end on this workflow (run 35813546798, job 107030112391, 283 of
    # 283 suites green): 77 m 58 s total — 45 m 41 s build, 30 m 19 s test. That runner was 1.22x slower
    # than the reference one, so the serial sweep on it would have been ~48.7 minutes and the job ~96:
    # this is a run that would have been cancelled and instead passed. The speedup is 1.6x rather than
    # 3x because the heavy suites are compute-bound and contend (per-suite durations inflate 2.25x under
    # three-way concurrency); there is no idle left on this runner to sell.
    #
    # AND IT IS NOT ENOUGH, which the job says itself: the budget step below warned at 86 %. On the test
    # side the binding constraint is a single suite: CloudField, 1182 s under concurrency, 65 % of the
    # whole makespan. Sharding this job into a matrix was considered and NOT taken then, because every
    # shard would have paid the same ~45-minute build. CI12 took it the other way round: ONE build, whose
    # test binaries are an artifact, and shards that only run them (see the block above this job).
    #
    # ── WHAT THE BUILD HALF ACTUALLY IS, MEASURED, BECAUSE THE FIRST READING OF IT WAS WRONG ─────────
    #
    # This comment used to say that ~70 % of the build is "spent reaching `Linking Desert`, one 1.3 GB
    # static archive that 283 test binaries then each link". The 70 % is a true statement about the
    # clock and a false one about the cause, and the second half is not true at all.
    #
    #   * NO TEST BINARY LINKS libDesert. Three makefiles in the whole workspace name it — Desert,
    #     Editor, Runtime. Every suite LISTS the engine translation units it needs and compiles them
    #     into itself, deliberately (see Desert/Tests/Engine/AssetHandleStability/premake5.lua, which
    #     writes down why). 275 of the 314 projects in that run had already linked BEFORE `Linking
    #     Desert` appeared; they could not have been waiting on it.
    #   * THE Desert PROJECT IS 8.7 OF THE 45.6 MINUTES, from `==== Building Desert ====` to `Linking
    #     Desert` in the same log. The 31 minutes before it are the third-party libraries, Common, the
    #     tools and most of the 283 test suites, scheduled alongside each other.
    #   * THE ARCHIVE IS NOT A COST. `ar` over libDesert.a's 270 objects is 17-20 s, measured twice on a
    #     developer machine. Linking is 1.8 minutes of CPU across all 306 links in the build.
    #   * THE TEST SUITES ARE THE BUILD. The control is in this same workflow: `macOS Shipping` builds
    #     the identical engine, editor, runtime and tools with the test projects REMOVED from the
    #     configuration, and its build step is 13-21 minutes against `macOS Release`'s 35-44. Windows
    #     says the same — Shipping 46-48 min, Release 113-115.
    #
    # So the build is ~100 % compiling, and a third of that compiling is the same file again: 505 of
    # the 1940 compiles in a Debug build repeat a (source, flags) pair already compiled in the SAME
    # build — Reflection.gen.cpp 39 times, ReflectionSerializer.cpp 35 — 68.7 of 223 minutes of
    # attributable compile CPU. That is what the ccache steps below are for.
    #
    # SO THE CEILING STAYS. Raising it would have bought a month and taught the job to grow unwatched;
    # lowering it now, against one measurement, would trade a real failure mode for a fake one. What is
    # new is that the margin no longer depends on a human re-reading this comment: the last step calls
    # scripts/CI/JobBudget.sh, which reads the number BELOW THIS LINE and warns past 80 % of it. Against
    # the four runs above it would have warned on the two 79-minute ones, before the crossing.
    timeout-minutes: 90
    steps:
      # The job's own clock. GitHub exposes the RUN's start time but not the JOB's, and on a busy
      # macOS queue those differ by minutes — `timeout-minutes` counts from here, so the budget report
      # must too. First step, before the checkout, so nothing the job does is outside the measurement.
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # THE BUILD NUMBER NEEDS HISTORY, and actions/checkout's default is depth 1. `git rev-list
          # --count HEAD` answers **1** in a shallow clone, so every artifact this workflow has ever
          # produced carried "0.1.1+<hash>" — a build number that looks like a number and is not one.
          # scripts/GenVersion.sh now DETECTS the shallow case and emits no build number at all rather
          # than that lie, which is honest but leaves the artifact without an identity the launcher can
          # gate a collection on (L2 design §4.4). So: full commit history, blobs fetched lazily — the
          # same `filter` the format job above uses, and for the same reason (Docs/Clouds/Shots alone is
          # over half a gigabyte of history nobody here needs). Commits and trees are cheap; it is the
          # historical blobs that are not, and a build only ever touches the checked-out ones.
          fetch-depth: 0
          filter: blob:none

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      # Written by a push to dev only — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job.
      - name: Save Homebrew downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.brew-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}

      # THE HALF OF THE REPO-ONLY GATE THAT THE FORMAT JOB CANNOT ANSWER. The replacement header for
      # <fmt/...> lives inside the ThirdParty/spdlog SUBMODULE, and the format job checks out without
      # submodules on purpose (a full checkout once ate its whole ten-minute budget). So the assertion
      # "the header we tell people to use instead actually exists" is made HERE, where submodules are
      # checked out, and --require-replacements turns a missing one into a failure rather than a note.
      #
      # It is cheap and it runs BEFORE the long build deliberately: a broken gate should be reported in
      # seconds, not after ninety minutes of sanitizer build.
      - name: Repo-only includes (replacements asserted)
        run: ./scripts/CI/RepoOnlyIncludes.sh --require-replacements

      # ── THE COMPILER CACHE, AND WHY ONLY THIS JOB PERSISTS ONE ───────────────────────────────────
      #
      # scripts/MacOS/BuildMacOS.sh uses ccache whenever it is installed, so every macOS job here gets
      # the WITHIN-A-BUILD half of the win for free and with no state at all: 505 of the 1940 compiles
      # in a Debug build are a repeat of a (source, flags) pair already compiled in the same build,
      # 30.8 % of the attributable compile CPU. That half needs nothing restored and nothing saved.
      #
      # This step buys the other half — the compiles a PREVIOUS run already did. GitHub keeps at most
      # 10 GB of Actions cache per repository and evicts the least recently used entry to make room;
      # every job that saves an entry takes a share of that and shortens how far back every other job's
      # entry survives. `macOS Release` / `macOS Shipping` persist one too since CI-SPEED (2026-10-10):
      # Release without it ran into its 60-minute ceiling; see the note on their Restore ccache.
      #
      # THE KEY IS THE COMMIT AND THE FALLBACK IS THE PREFIX, which is the standard shape and worth
      # stating because the alternative is tempting and wrong: a fixed key would be written once and
      # then never again (actions/cache refuses to overwrite an existing key), so the cache would
      # freeze at the state of whichever run created it and decay from there.
      #
      # RESTORING A STALE OR EVEN A FOREIGN CACHE CANNOT PRODUCE A WRONG OBJECT. The key only chooses
      # which blob is unpacked; what a hit means is decided inside ccache, by a hash of the compiler,
      # the full command line, the source and the contents of every header it includes. A blob from an
      # older commit therefore answers with objects for the translation units that did not change and
      # misses for the ones that did. See the block in scripts/MacOS/BuildMacOS.sh for the one place
      # this is NOT purely content-addressed — the `sloppiness` list — and the census behind each entry.
      #
      # THE CACHE IS WRITTEN BY dev ONLY — a push to refs/heads/dev — and READ by everyone else. Every
      # cache in this file follows this rule. A run may restore its own branch's entries and the
      # DEFAULT branch's (dev); a pull_request or an int/* run therefore finds dev's entries by prefix.
      # Measured 2026-10-07 (gh cache list): the repository limit is 10 GB, evicted least recently used,
      # and ONE branch's set was ~10 GB (Windows Debug 4.0, Release 2.6, sanitizers 2.4, Shipping 0.44,
      # Vulkan SDK 0.43). When int/* saved too, int/b3's set evicted dev's, and the next int/* branch
      # (which can see dev's and its own only) built Windows cold — Release 92 min on int/b1p1. So int/*,
      # pull_request and workflow_dispatch only restore, and the ccache ceilings are cut so dev's whole
      # set stays under 8.5 GB: sanitizers 2G, Windows Debug 2.5G, Release 2G, Shipping 0.6G, macOS
      # Release 0.8G, macOS Shipping 0.4G, plus the Vulkan SDK and the Homebrew downloads (~8.9 GB with
      # the two macOS entries — over 8.5: one of the Windows ceilings has to give once their dead
      # first-party writes are gone, CI-SPEED). ccache's max_size bounds its COMPRESSED on-disk size, so
      # the saved archive is at most the ceiling. Raise one ceiling -> lower another, or dev evicts itself.
      #
      # THE CACHE DIRECTORY IS NAMED HERE RATHER THAN INHERITED. ccache's default location depends on
      # the machine (XDG_CACHE_HOME, then ~/Library/Caches/ccache on macOS), and a `path:` that has to
      # agree with a default computed somewhere else is a gate that silently caches nothing the day
      # they diverge. `runner.temp` is job-scoped and empty at the start of the job, so nothing but
      # this restore can put anything in it.
      # THE RUNNER RAN OUT OF DISK, NOT THE CODE (run 36540884385, 2026-09-29: `ranlib: can't write to output
      # file (No space left on device)` on libDesert.a after 30 minutes of sanitizer build; the same commit
      # was green on its branch run). ASan objects are ~3x larger than plain Debug. The runner image carries
      # Xcodes, simulator runtimes and the Android SDK this job never uses; they go before the build, and
      # `df` prints the headroom so the next time it shrinks it is a number in the log, not a guess.
      - name: Free disk space
        run: |
          df -h / | tail -1
          active="$(xcode-select -p | sed 's|/Contents/Developer||')"
          for x in /Applications/Xcode*.app; do [ "$x" = "$active" ] || sudo rm -rf "$x"; done
          sudo rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}" /usr/local/share/dotnet ~/.dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          df -h / | tail -1

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-sanitizers-macos14-${{ github.sha }}
          restore-keys: |
            ccache-sanitizers-macos14-

      # A STEP timeout under the job's 90, the same fix as Windows (fca6befab): when the step runs out the
      # job is NOT being cancelled, so Save ccache below runs normally and keeps every object the build
      # finished. At the job ceiling the runner is already tearing down — Windows run 37484896713's save
      # printed success and no cache appeared. Run 37701712354 (int/b3, cold) built for 85 min and was
      # cancelled at the ceiling; the steps before the build took 5 min, Save of a 2G cache needs ~2, so
      # 78 leaves a dev push's cold build its cache and the next run its hits.
      # workflow_dispatch input ccache_debug only — see its note at the top of the file. Level 2, NOT 1:
      # ccache 4.14 writes .ccache-input-text only at debug_level >= 2 (ccache.cpp, do_cache_compilation
      # and init_hash_debug; manual "Cache debugging"); level 1 is the .ccache-log alone, which names the
      # manifest key but not what went into it (runs 38029077512/38035058047 came back with logs only).
      # Level 2 adds the small binary .ccache-input-c/-d next to it (no -p: depend mode never runs the
      # preprocessor), so ~2000 objects' worth still fits on this job's disk.
      - name: ccache debug mode
        if: inputs.ccache_debug
        run: |
          mkdir -p "$RUNNER_TEMP/ccache-debug"
          { echo "CCACHE_DEBUG=1"; echo "CCACHE_DEBUGLEVEL=2"; echo "CCACHE_DEBUGDIR=$RUNNER_TEMP/ccache-debug"; } >> "$GITHUB_ENV"

      - name: Build Debug with sanitizers
        timeout-minutes: 78
        env:
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=address,undefined"
          # THE DEFAULT IS 5 GiB AND IT IS NOT ENOUGH, which is the failure mode that looks exactly
          # like the cache working: ccache evicts least-recently-used entries as it fills, so a
          # too-small cache quietly turns the end of every build into misses. This Debug tree carries
          # ~6 GB of ASan objects uncompressed; ccache stores them zstd-compressed.
          CCACHE_MAXSIZE: "2G" # dev's set must fit 8.5 of the repository's 10 GB — see the note on Restore ccache
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ./scripts/MacOS/BuildMacOS.sh Debug

      # AFTER the build and BEFORE the tests: the tests are the half of this job most likely to fail,
      # and a build's worth of cache is worth keeping even when a suite goes red. `always()` for the
      # same reason — the cache is evidence-free, so there is no run whose cache is worth discarding.
      #
      # `continue-on-error`, and it is not a shrug: re-running this job on the same commit re-reserves
      # a key that already exists, and the cache is an OPTIMISATION — there is no state of the cache
      # service that should be able to turn a green build red. A failure to save costs the next run its
      # hits, which the statistics BuildMacOS.sh prints will show.
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-sanitizers-macos14-${{ github.sha }}

      - name: Pick ccache debug files
        if: always() && inputs.ccache_debug
        shell: bash
        run: ./scripts/CI/CcacheDebugPick.sh "$RUNNER_TEMP/ccache-debug" "$RUNNER_TEMP/ccache-debug-pick"

      - name: Upload ccache debug files
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-${{ github.job }}
          path: ${{ runner.temp }}/ccache-debug-pick/
          retention-days: 7

      # The expected list is build/TestManifest.txt, the same list the unsharded runner runs from (BUILD1),
      # minus the suites Desert/Tests/premake5.lua names in `vulkan_device_suites`
      # (build/TestNeedsVulkanDevice.txt) while the shards run on macos-14, a VM with no Metal device for
      # MoltenVK. The plan names them in a ::notice.
      - name: Plan test shards
        env:
          DESERT_MACOS_VULKAN_RUNNER: ${{ vars.DESERT_MACOS_VULKAN_RUNNER }}
        run: >-
          python3 scripts/CI/TestShards.py plan --expected build/TestManifest.txt --timings scripts/CI/TestTimings.tsv
          --column asan --shards 3 --out build/TestPlan
          --vulkan-device-suites build/TestNeedsVulkanDevice.txt --vulkan-runner-var DESERT_MACOS_VULKAN_RUNNER

      # tar, not upload-artifact's own zip: the zip drops the executable bit. The DWARF stays in the
      # object files, so ASan reports in a shard name functions but not lines; reproduce locally for lines.
      - name: Bundle the test binaries
        run: |
          # AssimpLibraryPin compares the linked assimp with build/generated/assimp/VERSION.txt (Assimp.lua).
          tar -czf "$RUNNER_TEMP/test-bundle.tgz" build/Bin/Tests/Debug build/TestManifest.txt build/TestPlan \
            build/generated/assimp/VERSION.txt
          du -sh build/Bin/Tests/Debug "$RUNNER_TEMP/test-bundle.tgz"

      - name: Upload the test bundle
        uses: actions/upload-artifact@v4
        with:
          name: test-bundle-asan
          path: ${{ runner.temp }}/test-bundle.tgz
          compression-level: 0
          retention-days: 3

      - name: Upload the shard plan
        uses: actions/upload-artifact@v4
        with:
          name: test-plan-asan
          path: build/TestPlan/
          retention-days: 3

      # LAST, and `always()`: the margin is worth reporting on a red run too, and it is worth reporting
      # most on a GREEN one — a green run at 88 % is the only warning anyone will ever get before the
      # crossing, and it is the run nobody opens.
      - name: Job budget
        if: always()
        run: ./scripts/CI/JobBudget.sh sanitizers "$JOB_START"

  sanitizers-tests:
    name: ASan+UBSan tests ${{ matrix.shard }}/3
    needs: [ sanitizers ]
    runs-on: macos-14
    # One shard is ~1/3 of the ~41-minute sweep, floored by JsonCensus (749 s); 45 is a ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # The suites find the checkout by walking up from their working directory and read tracked files;
      # BuildVersion asks git for the full history, hence the same clone as the build.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          filter: blob:none

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      # Written by a push to dev only — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job.
      - name: Save Homebrew downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.brew-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}

      - name: Download the test bundle
        uses: actions/download-artifact@v4
        with:
          name: test-bundle-asan
          path: ${{ runner.temp }}

      - name: Unpack the test bundle
        run: tar -xzf "$RUNNER_TEMP/test-bundle.tgz"

      - name: Run tests under sanitizers
        env:
          # detect_container_overflow=0: the third-party libs (Jolt, Lua, reflect-cpp, ...) are
          # built WITHOUT the sanitizer, so std::vector/string annotations are inconsistent across the ABI
          # boundary and ASan false-fires "container-overflow" in wrap_memcpy. Real OOB detection stays on.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:detect_container_overflow=0"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          TEST_LIST: build/TestPlan/shard-${{ matrix.shard }}.txt
        run: ./scripts/MacOS/RunTests.sh "$PWD" Debug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-asan-shard-${{ matrix.shard }}
          path: build/TestReports/
          if-no-files-found: ignore

      - name: Job budget
        if: always()
        run: ./scripts/CI/JobBudget.sh sanitizers-tests "$JOB_START"

  sanitizers-verdict:
    name: ASan+UBSan tests
    needs: [ sanitizers, sanitizers-tests ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # env, not a one-entry matrix: a matrix job whose name has no matrix expression gets its values
    # appended, and this name must stay exactly the check name the unsharded job had.
    env:
      ARTIFACT: asan
    steps: &test-verdict-steps
      - name: The build and every shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a build or test shard ended '$r'"; exit 1; }; done

      - name: Checkout the shard script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/CI
          sparse-checkout-cone-mode: true

      - name: Download the shard plan
        uses: actions/download-artifact@v4
        with:
          name: test-plan-${{ env.ARTIFACT }}
          path: plan

      - name: Download the shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-${{ env.ARTIFACT }}-shard-*
          path: reports

      - name: Every expected suite ran exactly once
        run: python3 scripts/CI/TestShards.py verify --plan plan --reports reports

  # The Release and Shipping builds, the test run, the shader lint, the shipping symbol census and the
  # packaging wait ONLY for the format gate, and run IN PARALLEL with the sanitizers. They used to wait
  # for `sanitizers-verdict` too ("no point spending a macOS build on code that trips a sanitizer"), but
  # that put the ASan build (65-73 min) plus its tests (up to 37 min) IN FRONT of this job's own ~40 min,
  # making macOS the longest chain to a verdict (~2.5 h) while the runner-minutes it saved were only
  # spent on red runs. The verdict of the run is the AND of every job anyway, so ordering bought nothing
  # but wall time. (format = static, cheap, still gates; sanitizers = DYNAMIC: it must build instrumented
  # and RUN the suite to catch memory/UB at runtime, so it necessarily compiles + tests Debug — that is
  # the check, not a duplicate of this job. Debug is therefore already covered there, so this job builds
  # Release + Shipping and nothing in Debug.)
  macos:
    name: macOS ${{ matrix.config }}
    needs: [ format ]
    runs-on: macos-14 # Apple Silicon (arm64) — matches the supported platform
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Debug is already built AND tested by the `sanitizers` job (under ASan+UBSan, which is
        # stricter), so this matrix does not need it — that removes a whole duplicate Debug build.
        #
        # SHIPPING IS HERE FOR ONE REASON, AND IT IS NOT macOS COVERAGE. It is the only platform on
        # which the END-TO-END half of the shipping boundary can be OBSERVED.
        # `scripts/CI/ShippingSymbols.sh` reads the linked player binary's own symbol table and asserts
        # eleven instrument names are absent while a positive control is present; `nm` reads that out of
        # a Mach-O. An MSVC-linked executable does not have one — link.exe puts no COFF symbol table in
        # an image, the names live in the .pdb, and `symbols "Off"` emits no .pdb. So a "ported" check
        # on Windows would be an absence test over an empty list, which passes on nothing at all: the
        # exact failure the script's positive control exists to make impossible, reintroduced by moving
        # the script. The check runs where it can mean something.
        #
        # That division is deliberate and each half is load-bearing. Windows answers "does this
        # configuration compile and link at all under MSVC" — the question nobody had asked. macOS
        # answers "is the debug surface actually gone from the artifact" — the question a compile cannot
        # answer. The property itself is platform-independent by construction: one token,
        # DESERT_DEV_INSTRUMENTS, defined in one place from a define the workspace sets, with no
        # platform branch anywhere in its definition (Desert/Tests/Runtime/ShippingBoundary relation 1
        # is what keeps it that way), so observing it on one platform is observing it.
        #
        # This leg also puts the documented developer command — `scripts/MacOS/BuildMacOS.sh Shipping`,
        # which is what the packager's own error message tells people to run — under test.
        config: [Release, Shipping]

    steps:
      # The job's own clock — see the note on the `sanitizers` job's copy of this step.
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full commit history, blobs lazily — see the note on the sanitizers job's checkout. This is
          # the job that PACKAGES the Release artifact, so it is the one whose build number is shipped.
          fetch-depth: 0
          filter: blob:none

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}
          restore-keys: brew-${{ runner.os }}-

      # Idempotent: installs brew packages + fetches non-submodule third-party (optick, volk,
      # reflect-cpp sources). Submodules are already in place from the checkout.
      - name: Setup dependencies
        run: ./scripts/MacOS/Setup.sh

      # Written by a push to dev only — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job.
      - name: Save Homebrew downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.brew-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('scripts/MacOS/Setup.sh') }}

      # THE SAME CACHE AS THE sanitizers JOB, PER CONFIGURATION (the flags differ, nothing hits across
      # them): restored by every run from dev's newest entry, written by a push to dev ONLY — see the
      # notes on the sanitizers job's Restore ccache. Without it Release compiled cold on every run and
      # reached the job's 60-minute ceiling (CI-SPEED, 2026-10-10). Ceilings 0.8G / 0.4G: Shipping has
      # no test projects, so it compiles about half of what Release does.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos14-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-macos14-${{ matrix.config }}-

      # A STEP timeout under the job's 60, for the same reason as the sanitizers build: a step that runs
      # out leaves the job alive, so Save ccache keeps every object a cold dev build finished.
      - name: Build ${{ matrix.config }}
        timeout-minutes: 50
        env:
          CCACHE_MAXSIZE: ${{ matrix.config == 'Release' && '0.8G' || '0.4G' }}
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ./scripts/MacOS/BuildMacOS.sh ${{ matrix.config }}

      # After the build and before the tests, `always()`, `continue-on-error` — see the sanitizers job.
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos14-${{ matrix.config }}-${{ github.sha }}

      # Not in Shipping: the test projects are removed from that configuration in
      # Desert/Tests/premake5.lua, so build/Bin/Tests/Shipping is never created and there is nothing to
      # run. Unguarded, this step goes RED rather than silently green — RunTests.sh exits 1 on a missing
      # test directory, checked in the script and not assumed from it — which is the right direction for
      # the failure to point and still not a verdict worth spending a step on. See the same note on the
      # Windows job.
      #
      # THE SUITE LIST GOES THROUGH THE SAME PLAN AS THE SHARDS (CI-MVK). macos-14 is the VM with no Metal
      # device for MoltenVK that the sanitizer shards already leave the Vulkan-device suites out on; this
      # job ran build/TestManifest.txt whole, so EngineHost and RenderGraphVulkan failed here on every run
      # since CI-DEVICE named them (CI 37647847473 onward). One shard of TestShards.py plan is that rule
      # with nothing split: the suites in build/TestNeedsVulkanDevice.txt are named in a ::notice unless
      # DESERT_MACOS_VULKAN_RUNNER is 'true', and RunTests.sh runs the planned list. The asan column is the
      # macOS one in the timing table; with one shard it only orders the list, heaviest first.
      - name: Plan test suites
        if: matrix.config != 'Shipping'
        env:
          DESERT_MACOS_VULKAN_RUNNER: ${{ vars.DESERT_MACOS_VULKAN_RUNNER }}
        run: >-
          python3 scripts/CI/TestShards.py plan --expected build/TestManifest.txt --timings scripts/CI/TestTimings.tsv
          --column asan --shards 1 --out build/TestPlan
          --vulkan-device-suites build/TestNeedsVulkanDevice.txt --vulkan-runner-var DESERT_MACOS_VULKAN_RUNNER

      - name: Run tests
        if: matrix.config != 'Shipping'
        env:
          TEST_LIST: build/TestPlan/shard-1.txt
        run: ./scripts/MacOS/RunTests.sh "$PWD" ${{ matrix.config }}

      # Offline shader lint: every .shader parses with the SAME DShaderParser the engine uses —
      # a broken shader fails the pipeline here instead of the editor at runtime.
      - name: Lint shaders (DShaderTool)
        working-directory: Editor
        run: ../build/Bin/${{ matrix.config }}/DShaderTool Resources/Shaders

      # ── THE HALF OF THE SHIPPING BOUNDARY THAT READS THE LINKED ARTIFACT ──────────────────────────
      #
      # Desert/Tests/Runtime/ShippingBoundary reads the SOURCES and asserts each instrument sits behind
      # `DESERT_DEV_INSTRUMENTS`. It runs on every sweep and it compiles no engine code, which is what
      # makes its verdict configuration-independent — and is also its limit: a source census cannot see
      # a static library's archive member being pulled in by a reference nobody wrote down. This step
      # reads the binary a player would run and asserts the names are not in it.
      #
      # IT CANNOT BE A TEST, and that is not a preference. A test binary is compiled in ONE
      # configuration and it is never this one; a Debug test cannot build a Shipping engine to look
      # inside it, and one that shelled out to `make` would take forty minutes and would BE the build.
      #
      # Its exit codes are its interface: 0 clean, 1 an instrument is in the binary, 2 THE CHECK COULD
      # NOT RUN. The 2 is the whole reason it is a script and not three lines of grep — `nm` on a
      # stripped or missing binary prints nothing, and "nothing" satisfies every absence check ever
      # written, so the script also requires a positive control (`DrawIndexedCounted`, which lives in
      # the very translation unit the draw counter was cut out of) to be PRESENT before it reports any
      # absence at all. Without that, "the instruments are gone" and "I could not read the binary" are
      # the same green.
      - name: Symbol census of the shipping binary
        if: matrix.config == 'Shipping'
        run: ./scripts/CI/ShippingSymbols.sh

      # THE PLAYER'S ARTIFACT, and it belongs in the SHIPPING leg rather than beside the drop: the
      # Shipping Runtime is built here and nowhere else, and a game packaged against a Release runtime
      # would ship the debug instruments the Shipping configuration exists to cut.
      - name: Package the sandbox game
        if: matrix.config == 'Shipping'
        # `--out` is ABSOLUTE: GamePackager changes into the project folder (Editor/) before it writes,
        # so a relative one produced Editor/dist/Game and the upload below found nothing.
        run: ./build/Bin/Shipping/GamePackager Projects/Desert/Desert.deproj --config Shipping --out "$GITHUB_WORKSPACE/dist/Game"

      - name: Upload the game
        if: matrix.config == 'Shipping'
        uses: actions/upload-artifact@v4
        with:
          name: DesertSandbox-macOS
          path: dist/Game/
          retention-days: 14

      # THE PACKAGED GAME HAS TO START, not only exist (PKG2): a Debug package on a developer Mac packaged
      # fine and then aborted at vkCreateInstance, because nothing ever ran the .app. `--shot` is not
      # compiled into Shipping, so the smoke run packages the Release runtime and starts the bundle through
      # its own CFBundleExecutable — the launcher that sets the bundled ICD — exactly as Finder would.
      # macos-14 is a VM: whether MoltenVK gets a Metal device there is not proven, so the run is gated
      # like the Windows one. Set the repository variable DESERT_MACOS_VULKAN_RUNNER to 'true' on a runner
      # that has one (self-hosted Apple Silicon); a crash, a non-zero exit, a missing PNG or ten minutes
      # without exiting fails the job.
      - name: Smoke-run the packaged game (Vulkan runner only)
        if: matrix.config == 'Release' && vars.DESERT_MACOS_VULKAN_RUNNER == 'true'
        run: |
          ./build/Bin/Release/GamePackager Projects/Desert/Desert.deproj --config Release --out "$GITHUB_WORKSPACE/dist/Game-Release"
          app="$(find "$GITHUB_WORKSPACE/dist/Game-Release" -maxdepth 1 -name '*.app' | head -n 1)"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          shot="$RUNNER_TEMP/packaged-smoke.png"
          ( "$app/Contents/MacOS/$exe" --shot "$shot" --shot-frames 30 ) & pid=$!
          ( sleep 600; kill "$pid" 2>/dev/null ) & watchdog=$!
          wait "$pid"; kill "$watchdog" 2>/dev/null || true
          [ -s "$shot" ] || { echo "the packaged game exited 0 but wrote no PNG at $shot"; exit 1; }

      - name: Smoke run skipped — no Vulkan on this runner
        if: matrix.config == 'Release' && vars.DESERT_MACOS_VULKAN_RUNNER != 'true'
        run: echo "::notice title=Packaged game NOT started::macos-14 is a VM with no proven Metal device for MoltenVK; set DESERT_MACOS_VULKAN_RUNNER=true on a Vulkan-capable Mac runner to smoke-run the packaged .app"

      # Surface the test reports even when a step above failed.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.config }}
          path: build/TestReports/
          if-no-files-found: ignore

      # THE ENGINE DROP: the editor + the tools + the loose engine resources they read. NOT a game;
      # the game is a SEPARATE artifact, built in the Shipping leg below.
      #
      # THE REASON THIS COMMENT USED TO GIVE WAS FALSE, and it kept a player-facing artifact out of CI
      # for weeks. It said a game "is packaged by the editor's own PackageGame(), which needs an open
      # project that CI does not have". Measured 2026-09-22, both halves wrong: `PackageGame` touches
      # no renderer, no VkDevice, no Application and no editor singleton — `Desert/Tests/Editor/
      # PackagedContent` has been calling it inside a gtest binary on both platforms for weeks — and
      # `Projects/Desert/Desert.deproj` is tracked, so CI has had a project all along. `Tools/GamePackager` is
      # that call with a `main` around it, not a second packaging system.
      #
      # Release only for the drop; a Debug artifact would be huge and unused.
      #
      # This comment used to say "binaries + Content.dpak (built with the same PakTool the Runtime
      # mounts) + loose Resources", and П5 measured that claim false on 2026-09-08: the pak's only
      # possible reader was the Runtime beside it, and that Runtime mounted 144 MB and then refused,
      # because a pak of Editor/Resources carries no project descriptor. The pak and its manifest are
      # gone from both platform scripts, and the artifact went 528 -> 384 MB — 52 % of it had been one
      # tree shipped twice. Three places asserted the same wrong thing (both scripts and this line);
      # if a fourth appears, it is the same defect, not a new one.
      - name: Package build
        if: matrix.config == 'Release'
        run: ./scripts/MacOS/Package.sh Release

      - name: Upload packaged build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: DesertEngine-macOS-Release
          path: dist/DesertEngine-Release/
          retention-days: 14

      - name: Job budget
        if: always()
        run: ./scripts/CI/JobBudget.sh macos "$JOB_START"

  # Windows is a SUPPORTED target, not an afterthought: the engine is developed on it, yet nothing here
  # compiled it, so MSVC-only breakage (object-file section limits, the <windows.h> min/max macros, CRT
  # mismatches between static libs, wide-string filesystem paths) reached the branch unnoticed. Depends
  # only on `format`, not on the macOS-specific `sanitizers` job, so Windows feedback is not gated behind
  # it — which matters more than it did when this was written: that job said "a 15-minute macOS run" and
  # `sanitizers` now takes 55 to 66 minutes (measured 2026-09-05 over the last five green runs). The
  # decision was right; only its stated price was a year out of date.
  # Three jobs, not one three-way matrix, so that each configuration's test shards can wait for THEIR
  # build only (a `needs:` names a whole matrix). The steps are shared by a YAML anchor; the job id is
  # what JobBudget.sh reads the ceiling of, via ${{ github.job }}.
  windows-debug:
    name: Windows ${{ matrix.config }} build
    needs: [ format ]
    # PINNED, NOT "latest". On 2026-09-14 `windows-latest` rolled forward to an image carrying Visual
    # Studio 18 Enterprise, which does NOT ship the MSVC v143 toolset. premake's vs2022 action writes
    # PlatformToolset=v143 into every .vcxproj, so msbuild on that image fails with MSB8020 -- Setup.bat
    # now says so by name instead, which is how the five red runs after dff392b5 got diagnosed at all.
    #
    # The label moving under us is the defect, not the image: a runner that silently changes compiler
    # is a green CI that stopped meaning what it meant. So the image is named, and moving to a newer
    # toolset is its own migration with its own measurement -- not something a label does overnight.
    runs-on: windows-2022
    # 150, not 90, and the margin is the point. Measured 2026-09-05 over the last four green runs,
    # Windows Debug takes 73, 73, 76 and 84 minutes — 81 % to 93 % of a 90-minute budget. Twice it went
    # over and GitHub cancelled it, at ~90 minutes each time (runs 33915939489 and 33940280564).
    #
    # Then the very next run settled it: 33958917578 took 93 min 39 s and PASSED. Under the old ceiling
    # that green run would have been cancelled instead, and cancelled reports as nothing being wrong.
    #
    # A cancelled job is the worst of the three outcomes, worse than a red one: it reports as
    # "cancelled", not "failure", so nothing looks broken while the platform that diverges MOST from
    # macOS — windows.h macros eating method names, wide-string path::native(), Release-only float
    # cancellation — quietly produces no evidence at all. Raising the ceiling stops losing evidence
    # today; it does not make the build faster, and the growth is real (the vertex-path split added
    # shaders and is the likeliest cause of the first cancellation). Cutting the build time is its own
    # task; until it lands, this number must stay well clear of the measured duration.
    #
    # IT LANDED (task WR1, the ccache block below): Windows Release 121.8 -> 80.2 min, Debug 93 -> 57,
    # Shipping 50 -> 29 in run 35863890019. The ceiling is left where it is on purpose -- lowering it
    # is a separate call, after more than one run has shown where the new durations settle.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # THREE CONFIGURATIONS, AND THE THIRD IS THE ONE A PLAYER GETS.
        #
        # Debug is what the engine is developed in and is where the section-count and Debug-CRT problems
        # live. Release is the DEVELOPMENT drop — the editor and the tools this job packages below — and
        # is where optimizer- and NDEBUG-only breakage hides.
        #
        # THIS LINE USED TO SAY "Release is what ships". IT STOPPED BEING TRUE. Since the `Shipping`
        # configuration landed, a game ships as `Shipping`: a build in which the runtime frame capture,
        # Optick, Common::Profiling, the GPU profiler, the draw-call counter, the memory watch and the
        # synchronous-load ledger are not compiled at all. Release still ships the ENGINE DROP (the
        # editor and tools, see the packaging step below) — and that is a different artifact with a
        # different audience, which is exactly why the old sentence read as true for a while.
        #
        # WHY SHIPPING HAS TO BE HERE, ON WINDOWS. Windows is the platform the game ships for, and until
        # this leg existed the shipping configuration had been compiled exactly ONCE, on one macOS
        # machine. MSVC had never seen it. `runtime "Release"` / `optimize "Full"` / `symbols "Off"` are
        # all valid MSVC settings, but "valid settings" is not "it compiles", and this repository keeps a
        # register of defects that are invisible from a Mac: popen/pclose against _popen/_pclose,
        # path::string() handing back backslashes so five path filters silently matched nothing, a
        # missing setenv, windows.h macros eating method names, a zero-length C array clang accepts as a
        # GNU extension and MSVC rejects with C2466, and REM inside `for ... in ( )` being DATA to cmd
        # rather than a comment. The seventh of those cost a red `dev` for a day. A whole configuration
        # that no compiler on the shipping platform has ever seen is the same bet, taken larger.
        #
        # shards: how many test shards the plan is cut into (0 = no tests in this configuration).
        config: [Debug]
        ccache_max: [2.5G]
        column: [windows-debug]
        shards: [3]

    steps: &windows-build-steps
      # The job's own clock — see the note on the `sanitizers` job's copy of this step. `shell: bash`
      # because the runner image ships Git Bash and this is one line of POSIX; cmd has no `date +%s`,
      # and every quoting form that survives cmd here is one nobody can read (Desert/Tests/premake5.lua
      # carries that scar). Nothing in it shells out, so the single-quote trap does not apply.
      - name: Record job start
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # DEFENDER OFF for the build (task CIW4). The hosted windows-2022 image scans every file cl.exe and
      # link.exe write in real time, and this job writes tens of thousands of objects, ccache blobs and
      # PDBs. The runner is a throwaway VM with admin rights, so turning real-time scanning off costs
      # nothing it protects; a machine that is NOT throwaway gets folder exclusions instead, never this.
      # continue-on-error: a refused switch (a future image without the right) must not turn a build red --
      # the step prints what it got, and the job budget line shows whether the build got faster.
      - name: Windows Defender real-time scanning off
        continue-on-error: true
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "RealTimeProtectionEnabled = $((Get-MpComputerStatus).RealTimeProtectionEnabled)"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full commit history, blobs lazily — see the note on the sanitizers job's checkout. Windows
          # packages the Release artifact too, and it is also where the BuildVersion suite proves the
          # header agrees with git on a platform no developer here can run.
          fetch-depth: 0
          filter: blob:none

      # The engine links shaderc*.lib and spirv-cross-*.lib out of the SDK's Lib directory, so a
      # headers-only Vulkan install is not enough — this is the real LunarG SDK. Pinned so a new SDK
      # release cannot change the build under us, and cached because it is a ~200 MB download.
      # The cache only restores; scripts/CI/EnsureVulkanSdk.ps1 judges the restored TREE and installs
      # what is missing — the same script the test shards run, so both jobs see the same SDK.
      - name: Restore Vulkan SDK
        id: vulkan-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\VulkanSDK
          # The suffix is part of the key because the cache stores an INSTALL, not a download: an entry
          # saved without a part is restored forever under the same key and the script must re-add that
          # part on every run. The suffix names the parts EnsureVulkanSdk.ps1 requires (debug component,
          # loader). Change that set -> change this suffix.
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-debuglibs-loader

      - name: Ensure Vulkan SDK
        shell: pwsh
        run: ./scripts/CI/EnsureVulkanSdk.ps1 -Version ${{ env.VULKAN_SDK_VERSION }}

      # Written by a push to dev only — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job.
      - name: Save Vulkan SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.vulkan-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-debuglibs-loader

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Same script a developer runs: fetches the non-submodule third-party (optick, meshoptimizer),
      # and generates the VS solution. (It no longer writes Version.gen.hpp — the build does, through
      # Common.vcxproj's PreBuildEvent.) Running it here means the documented
      # setup path is itself under test — a broken Setup.bat fails CI instead of the next new machine.
      #
      # --unity (task CI10): Common, Desert and Editor compile as MSBuild unity files, groups of 12
      # sources (BuildScripts/UnityBuild.lua; the test suites stay one source per compile so their
      # shared sources keep hitting ccache). ONLY HERE -- a developer's Setup.bat run leaves it off.
      # BEFORE, the numbers to compare the first unity run against (ccache + MultiToolTask, run
      # 35863890019): Build step Release 74.7 min, Debug 36.0, Shipping 26.2; whole job Release 80.2,
      # Debug 57, Shipping 29. The owner's working figure for the Windows job today: 1.5-2 h.
      - name: Setup dependencies + generate projects
        shell: cmd
        run: scripts\Windows\Setup.bat --unity

      # ── THE COMPILER CACHE, WITHIN ONE BUILD ────────────────────────────────────────────────────
      #
      # WHERE THIS JOB'S TIME WAS. Run 35840757086 (dc3e7487): Windows Release 115.8 min, of which
      # Build 111.5, Run tests 1.4, everything else 2.9. Inside the build, by the time each project
      # finished: Common 11.3 min, Desert 78.2, the last test suite 95.2, Editor 111.5 -- the last 16
      # minutes are Editor compiling on ONE core while three sit idle, and Windows Shipping, which has
      # no suites, still spends 21 of its 49 build minutes on Desert and 20 on Editor for the same
      # reason. So there are two costs, and the wiring below addresses both:
      #   1. the SAME (source, flags) compiled again by another suite -- 505 of 1940 compiles, 30.8 %
      #      of compile CPU, measured on macOS by B2 over the same premake scripts;
      #   2. no parallelism INSIDE a project (no /MP, see BuildScripts/Workspace.lua).
      # 2 is answered in every generated project now (UseMultiToolTask + EnforceProcessCountAcrossBuilds,
      # BuildScripts/MSBuildProperties.lua), and that one-source-per-cl.exe is also what ccache needs --
      # see BuildScripts/MSBuild/Ccache.props for the cache's own properties and Ccache.targets for /Zi -> /Z7.
      # Both are imported by NAME on the msbuild line below, never as Directory.Build.* from the root,
      # but at the SAME two points Directory.Build.* would be (CustomBeforeMicrosoftCommonProps /
      # CustomAfterMicrosoftCommonTargets) -- see the gate after the build step for why that matters.
      #
      # MEASURED, first green run 35863890019 (9feaa1ee) against the eleven complete Release builds
      # before it (111.5-119.9 min, median 115.8): Build Release 74.7, Debug 36.0 (was 67.6-75.1),
      # Shipping 26.2 (was 31.6-49.4). ccache: 493 / 1971 hits in Release, 494 / 1971 in Debug, and
      # 0 / 873 in Shipping -- which has no suites and therefore nothing to repeat, so ITS 22 minutes
      # are the MultiToolTask alone, the negative control for the cache.
      #
      # NOTHING IS RESTORED OR SAVED. Every hit here is a compile an EARLIER PROJECT OF THIS SAME BUILD
      # did; the cache starts empty in a job-scoped directory. Persisting it across runs is a separate
      # decision with a price (the repository's shared 10 GB, see the note on the sanitizers job).
      #
      # PINNED BY VERSION AND BY HASH: the binary sits in front of every compile of the three legs, and
      # a release changing under us would change the build without a commit saying so.
      - name: Install ccache (as cl.exe)
        shell: pwsh
        run: |
          $ver = "4.14"
          $sha = "2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f"
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$ver/ccache-$ver-windows-x86_64.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "ccache $ver zip hash is $got, expected $sha" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ccache-dist"
          $exe = "$env:RUNNER_TEMP\ccache-dist\ccache-$ver-windows-x86_64\ccache.exe"
          # The masquerade directory: ccache.exe under the name cl.exe, and nothing else in it.
          $masq = "$env:RUNNER_TEMP\ccache-cl"
          New-Item -ItemType Directory -Force $masq | Out-Null
          Copy-Item $exe "$masq\cl.exe"
          @(
            "DESERT_MSVC_CCACHE=$masq"
            "CCACHE_EXE=$exe"
            "CCACHE_DIR=$env:RUNNER_TEMP\ccache"
            # Per configuration (matrix.ccache_max), sized so dev's whole cache set fits 8.5 of the
            # repository's 10 GB — see "THE CACHE IS WRITTEN BY dev ONLY" on the sanitizers job. Below
            # the build's full object set (Debug saved 4.0 GB at 20G), so the LRU keeps the newest.
            "CCACHE_MAXSIZE=${{ matrix.ccache_max }}"
            # The same four entries, with the same census behind them, as scripts/MacOS/BuildMacOS.sh.
            "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            # premake writes IntDir as $(ProjectDir)build\...\<Project>\ -- absolute and different for
            # every project -- and ccache hashes an MSVC object's directory by default, which would
            # make a suite's copy of an engine source miss against the identical compile before it.
            # What that hash guards is the object's own path inside its /Z7 debug records, which
            # nothing here reads; the source path that also lands in the object is still hashed.
            "CCACHE_NOHASHDIR=1"
            # On a miss, learn the includes from the real compile's /showIncludes instead of running
            # the preprocessor first -- otherwise every miss is paid for twice.
            "CCACHE_DEPEND=1"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe --version | Select-Object -First 1

      # THE CACHE OUTLIVES THE RUN. Without these two steps CCACHE_DIR started empty on every runner,
      # so the only hits were one suite's copy of an engine source against another's inside the same
      # build (911 / 3172 = 28.7 % in run 37461974209) and every Release build paid the full cold cost —
      # 150 minutes and cancelled once the suites outgrew the ceiling. Keyed per configuration (the
      # flags differ, nothing would hit across them) and per commit, restored from the newest of its
      # configuration. Saved by a push to dev ONLY (see "THE CACHE IS WRITTEN BY dev ONLY" on the
      # sanitizers job): an int/* save evicted dev's set from the 10 GB, and every NEW int/* branch
      # then built cold. int/* restores dev's newest entry by the prefix below.
      # workflow_dispatch input ccache_debug, Shipping only (the smallest leg; its first-party objects
      # miss like the other two) — see the input's note at the top of the file.
      - name: ccache debug mode
        if: inputs.ccache_debug && matrix.config == 'Shipping'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ccache-debug" | Out-Null
          @(
            "CCACHE_DEBUG=1"
            "CCACHE_DEBUGLEVEL=2"
            "CCACHE_DEBUGDIR=$env:RUNNER_TEMP\ccache-debug"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.config }}-

      # A STEP timeout under the job's 150: when the step runs out the job is NOT being cancelled, so
      # Save ccache below runs normally and keeps every object the build finished. At the job ceiling
      # the runner was already tearing down — run 37484896713's Release save printed success and no
      # cache appeared.
      - name: Build ${{ matrix.config }}
        timeout-minutes: 130
        shell: cmd
        run: |
          "%CCACHE_EXE%" --zero-stats || exit /b 1
          msbuild build\Projects\Desert.sln -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m -v:minimal ^
            "-p:CustomBeforeMicrosoftCommonProps=%GITHUB_WORKSPACE%\BuildScripts\MSBuild\Ccache.props" ^
            "-p:CustomAfterMicrosoftCommonTargets=%GITHUB_WORKSPACE%\BuildScripts\MSBuild\Ccache.targets"

      # THE CACHE MUST SEE ONE SOURCE PER COMPILE, OR THE WIRING IS NOT IN EFFECT. When the imports
      # moved to /p:ForceImportBeforeCppTargets (6e1a17b1, d7ab8fa8) CLToolPath still applied but
      # UseMultiToolTask did not: ccache saw 359 calls instead of 2270, 211 of them "multiple source
      # files", hit once, and Windows Release grew from 78 to 104..146 minutes, a leg slowly
      # crossing its 150-minute ceiling. Nothing failed by name; it read as a hung runner. A
      # multi-source call means UseMultiToolTask is off, so it fails the job by name.
      # Right after the build, `always()`: a build cancelled at the ceiling still leaves every object
      # it finished, and that is what lets the next run get past the point this one stopped at. The
      # cache is an optimisation, so a failed save never turns the job red (`continue-on-error`).
      - name: Save ccache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ matrix.config }}-${{ github.sha }}

      - name: Pick ccache debug files
        if: always() && inputs.ccache_debug && matrix.config == 'Shipping'
        shell: bash
        run: ./scripts/CI/CcacheDebugPick.sh "$RUNNER_TEMP/ccache-debug" "$RUNNER_TEMP/ccache-debug-pick"

      - name: Upload ccache debug files
        if: always() && inputs.ccache_debug && matrix.config == 'Shipping'
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-${{ github.job }}
          path: ${{ runner.temp }}/ccache-debug-pick/
          retention-days: 7

      - name: ccache saw one source per compile
        shell: pwsh
        run: |
          $stats = & $env:CCACHE_EXE --print-stats
          $row = $stats | Select-String '^multiple_source_files\s+(\d+)$'
          if (-not $row) { $stats; throw "ccache --print-stats has no multiple_source_files row; the gate cannot read it" }
          $n = [int]$row.Matches[0].Groups[1].Value
          if ($n -ne 0) { throw "ccache saw $n compiles with more than one source: UseMultiToolTask is not in effect, see BuildScripts/MSBuildProperties.lua and BuildScripts/MSBuild/Ccache.props" }
          "multiple_source_files = 0"

      # Every outcome prints: a cache that saw nothing must not look like a build that needed nothing.
      # The disk and the largest archives are here because /Z7 moves debug information INTO the objects
      # and libraries -- a static library over 4 GB is a hard linker error (LNK1248), and the runner's
      # disk is finite -- so the margin on both is printed on every run, green ones included.
      #
      # AND THE ONE MARGIN THAT IS ALREADY THIN IS ANNOTATED. First measured run (35863890019):
      # Desert.lib is 2.92 GB in Debug, 1.23 GB in Release, 0.41 GB in Shipping -- Debug is at 73 % of
      # the limit, and the engine grows. Above 3 GB the run carries a warning on its summary page, so
      # the crossing is announced by green runs before a red one reports it as LNK1248. The step itself
      # never fails the job: it is a reading, not a gate.
      - name: ccache statistics and build footprint
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:CCACHE_EXE --show-stats -v
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          if (Test-Path build) {
            "build\ total: {0:N1} GB" -f ((Get-ChildItem build -Recurse -File | Measure-Object Length -Sum).Sum / 1GB)
            $libs = @(Get-ChildItem build -Recurse -Filter *.lib | Sort-Object Length -Descending | Select-Object -First 5)
            $libs | ForEach-Object { "{0,8:N0} MB  {1}" -f ($_.Length / 1MB), $_.FullName }
            if ($libs.Count -gt 0 -and $libs[0].Length -gt 3GB) {
              "::warning::{0} is {1:N2} GB, {2:N0} % of the 4 GB a static library may hold (LNK1248)" -f $libs[0].Name, ($libs[0].Length / 1GB), (100 * $libs[0].Length / 4GB)
            }
          }

      # The test binaries leave this job as early as possible: the shards start while the lint and the
      # packaging below still run. The expected list is build/TestManifest.txt, the list RunTests.ps1
      # has always failed against; TestShards.py refuses a plan whose union is not exactly that list.
      # The comment above `Run tests` in the shard job says why Shipping has no tests at all.
      # windows-2022 has no Vulkan device: the suites in `vulkan_device_suites` leave the plan
      # with a ::notice unless DESERT_WINDOWS_VULKAN_RUNNER is 'true' (the same switch as the smoke-run below).
      - name: Plan test shards
        if: matrix.shards > 0
        shell: bash
        env:
          DESERT_WINDOWS_VULKAN_RUNNER: ${{ vars.DESERT_WINDOWS_VULKAN_RUNNER }}
        run: >-
          python scripts/CI/TestShards.py plan --expected build/TestManifest.txt
          --timings scripts/CI/TestTimings.tsv --column ${{ matrix.column }}
          --shards ${{ matrix.shards }} --out build/TestPlan
          --vulkan-device-suites build/TestNeedsVulkanDevice.txt --vulkan-runner-var DESERT_WINDOWS_VULKAN_RUNNER

      - name: Test bundle footprint
        if: matrix.shards > 0
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem build\Bin\Tests\${{ matrix.config }} -Recurse -File | Group-Object Extension |
            ForEach-Object { "{0,-8} {1,5} files {2,10:N0} MB" -f $_.Name, $_.Count, (($_.Group | Measure-Object Length -Sum).Sum / 1MB) }

      # PDBs STAY, except the one CrashHandler reads. Measured in run 36441711706 (Windows Debug): 354 .exe =
      # 2.3 GB, 354 .pdb = 16.9 GB; the bundle with them zipped to 3.85 GB and took 6.6 min to upload.
      # CrashHandler asserts a symbol for its faulting frame and reads the PDB beside its own executable,
      # so THAT executable's PDB travels; a failing suite elsewhere still prints its gtest assertion, only a
      # native crash loses line numbers. Which executable holds the suite is build/TestManifest.txt's answer
      # (`<Runner> <Suite>`, written by Desert/Tests/premake5.lua), not a name written here: BUILD1-P1 moved
      # the suite from its own CrashHandler.exe into its layer's runner, and a hard-coded CrashHandler.pdb
      # kept "travelling" while no such file existed — eight CrashHandler failures on the shard.
      - name: Name the PDB that travels
        id: symbols
        if: matrix.shards > 0
        shell: pwsh
        run: |
          $runners = @(Get-Content build/TestManifest.txt | ForEach-Object {
              $f = -split $_
              if ($f.Count -eq 2 -and $f[1] -eq "CrashHandler") { $f[0] }
          })
          if ($runners.Count -ne 1) { throw "build/TestManifest.txt names CrashHandler in $($runners.Count) runners, want exactly 1" }
          $pdb = "build/Bin/Tests/${{ matrix.config }}/$($runners[0]).pdb"
          if (-not (Test-Path $pdb)) { throw "CrashHandler runs in $($runners[0]), but $pdb was not built" }
          Write-Host "CrashHandler runs in $($runners[0]); $pdb travels"
          "pdb=$pdb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload the test bundle
        if: matrix.shards > 0
        uses: actions/upload-artifact@v4
        with:
          name: test-bundle-windows-${{ matrix.config }}
          path: |
            build/Bin/Tests/${{ matrix.config }}/
            build/TestManifest.txt
            build/TestPlan/
            build/generated/assimp/VERSION.txt
            !build/Bin/Tests/${{ matrix.config }}/**/*.ilk
            !build/Bin/Tests/${{ matrix.config }}/**/*.lib
            !build/Bin/Tests/${{ matrix.config }}/**/*.exp
            !build/Bin/Tests/${{ matrix.config }}/**/*.pdb
            ${{ steps.symbols.outputs.pdb }}
          retention-days: 3

      - name: Upload the shard plan
        if: matrix.shards > 0
        uses: actions/upload-artifact@v4
        with:
          name: test-plan-windows-${{ matrix.config }}
          path: build/TestPlan/
          retention-days: 3

      # Offline shader lint with the SAME DShaderParser the engine uses — mirrors the macOS job.
      #
      # RUNS IN SHIPPING TOO, and there it is doing a second job worth naming: it is the only step in the
      # Shipping leg that EXECUTES something MSVC built under `optimize "Full"` / `symbols "Off"`.
      # Compiling and linking is not starting up, and the test suite — the usual answer to "does it
      # run" — is not built in this configuration.
      - name: Lint shaders (DShaderTool)
        shell: cmd
        working-directory: Editor
        run: ..\build\Bin\${{ matrix.config }}\DShaderTool.exe Resources\Shaders

      # THE PLAYER'S ARTIFACT ON WINDOWS, packaged by the same headless tool the macOS Shipping leg uses
      # (Tools/GamePackager). Release too, not only Shipping: Release is the leg that can photograph the
      # game (`--shot` is not compiled into Shipping), so the smoke run below needs its package. `--out`
      # is ABSOLUTE because GamePackager works from the project folder (Editor/), so a relative one
      # would land under Editor/.
      - name: Package the sandbox game
        if: matrix.config != 'Debug'
        shell: bash
        run: ./build/Bin/${{ matrix.config }}/GamePackager.exe Projects/Desert/Desert.deproj --config ${{ matrix.config }} --out "$GITHUB_WORKSPACE/dist/Game-${{ matrix.config }}"

      # THE GAME MUST START ON A CLEAN MACHINE: no Visual C++ Redistributable installed. The workspace
      # builds with the DLL CRT (/MD; the Vulkan SDK's shaderc/spirv-cross are MD_DynamicRelease) and
      # GamePackager copies the VC++ runtime DLLs Runtime.exe imports next to it. This reads the packaged
      # binaries' own import tables, refuses any DLL outside scripts/CI/windows_allowed_dlls.txt, and
      # refuses an `app-local` DLL that is imported but not present in the package.
      - name: Packaged game imports only allowed DLLs
        if: matrix.config != 'Debug'
        shell: bash
        run: |
          exe="$(find "$GITHUB_WORKSPACE/dist/Game-${{ matrix.config }}" -maxdepth 2 -name Runtime.exe | head -n 1)"
          [ -n "$exe" ] || { echo "no Runtime.exe under dist/Game-${{ matrix.config }}"; exit 1; }
          ./scripts/CI/CheckWindowsDlls.sh scripts/CI/windows_allowed_dlls.txt "$exe"

      # SMOKE RUN OF THE PACKAGED GAME — ONLY ON A VULKAN-CAPABLE RUNNER, AND SAYING SO WHEN SKIPPED.
      # windows-2022 has no GPU and this job installs no software Vulkan (lavapipe / SwiftShader), so
      # Runtime.exe cannot create a device there; running it would only prove the runner, not the game.
      # Set the repository variable DESERT_WINDOWS_VULKAN_RUNNER to 'true' once this job runs on a runner
      # with a Vulkan driver (self-hosted GPU, or a software ICD installed by a step above). The run
      # renders a fixed number of frames, writes a PNG and exits; a crash, a non-zero exit, a missing
      # PNG or ten minutes without exiting fails the job.
      - name: Smoke-run the packaged game (Vulkan runner only)
        if: matrix.config == 'Release' && vars.DESERT_WINDOWS_VULKAN_RUNNER == 'true'
        shell: bash
        run: |
          gameDir="$(dirname "$(find "$GITHUB_WORKSPACE/dist/Game-Release" -maxdepth 2 -name Runtime.exe | head -n 1)")"
          shot="$RUNNER_TEMP/packaged-smoke.png"
          cd "$gameDir"
          timeout 600 ./Runtime.exe --shot "$shot" --shot-frames 30
          [ -s "$shot" ] || { echo "Runtime.exe exited 0 but wrote no PNG at $shot"; exit 1; }

      - name: Smoke run skipped — no Vulkan on this runner
        if: matrix.config == 'Release' && vars.DESERT_WINDOWS_VULKAN_RUNNER != 'true'
        shell: bash
        run: echo "::notice title=Packaged game NOT started::windows-2022 has no Vulkan device; set DESERT_WINDOWS_VULKAN_RUNNER=true on a Vulkan-capable runner to smoke-run dist/Game-Release/**/Runtime.exe"

      - name: Package build
        if: matrix.config == 'Release'
        shell: cmd
        run: scripts\Windows\Package.bat Release

      - name: Upload packaged build
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: DesertEngine-Windows-Release
          path: dist/DesertEngine-Release/
          retention-days: 14

      # bash again, and the same script the macOS jobs run: the budget question is about the workflow
      # file, which is identical on both platforms, so a second implementation would be a second thing
      # to keep in step. This job has been cancelled by its own ceiling TWICE (runs 33915939489 and
      # 33940280564) and settles at 81-93 % of even the raised one, so it is the job this warning was
      # written for.
      - name: Job budget
        if: always()
        shell: bash
        run: ./scripts/CI/JobBudget.sh "${{ github.job }}" "$JOB_START"

  windows-release:
    name: Windows ${{ matrix.config }} build
    needs: [ format ]
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      matrix:
        config: [Release]
        ccache_max: [2G]
        column: [windows-release]
        shards: [1]
    steps: *windows-build-steps

  windows-shipping:
    name: Windows ${{ matrix.config }}
    needs: [ format ]
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      matrix:
        config: [Shipping]
        ccache_max: [0.6G]
        column: [none]
        shards: [0]
    steps: *windows-build-steps

  windows-debug-tests:
    name: Windows Debug tests ${{ matrix.shard }}/3
    needs: [ windows-debug ]
    runs-on: windows-2022
    # One shard is ~1/3 of the 29-minute sweep of run #900, floored by ShaderCacheKey (577 s).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [Debug]
        shard: [1, 2, 3]
    steps: &windows-test-steps
      - name: Record job start
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Windows Defender real-time scanning off
        continue-on-error: true
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "RealTimeProtectionEnabled = $((Get-MpComputerStatus).RealTimeProtectionEnabled)"

      # The suites find the checkout by walking up from their working directory and read tracked files;
      # BuildVersion asks git for the full history, hence the same clone as the build.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          filter: blob:none

      # The SDK the build had, by the build's own path: restore the same cache key, then
      # EnsureVulkanSdk.ps1 checks the tree and installs whatever part is missing. The suites need the
      # LOADER at process start (EngineTests/EditorTests/ToolsTests import vulkan-1.dll; without it every
      # suite of those runners exits -1073741515 before main), and the loader is part of the tree. A
      # restore is not trusted to be complete — the script judges the files, not "Cache restored".
      - name: Restore Vulkan SDK
        uses: actions/cache/restore@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-debuglibs-loader

      - name: Ensure Vulkan SDK
        shell: pwsh
        run: ./scripts/CI/EnsureVulkanSdk.ps1 -Version ${{ env.VULKAN_SDK_VERSION }}

      - name: Download the test bundle
        uses: actions/download-artifact@v4
        with:
          name: test-bundle-windows-${{ matrix.config }}
          path: build

      # NOT IN SHIPPING, AND NOT BECAUSE IT WOULD BE SLOW — BECAUSE THERE IS NOTHING TO RUN. The test
      # projects are removed from the Shipping configuration in Desert/Tests/premake5.lua: a suite whose
      # subject is the draw-call counter cannot be built in the one configuration that removes the
      # draw-call counter. run_tests.bat is written by RunAllTests's postbuild, which goes with them, so
      # a Shipping build produces no runner at all. So Shipping has `shards: 0` and no test job: a test
      # job that existed and ran zero suites would be a silent pass, the defect class this repository
      # names Ф4.
      #
      # run_tests.bat is generated by the build and does not travel; this is the line it runs, with the
      # shard's list. RunTests.ps1 still fails on a listed suite with no binary behind it.
      - name: Run tests
        shell: cmd
        run: >-
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\Windows\RunTests.ps1
          -Config ${{ matrix.config }} -ListFile build\TestPlan\shard-${{ matrix.shard }}.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows-${{ matrix.config }}-shard-${{ matrix.shard }}
          path: build/TestReports/
          if-no-files-found: ignore

      - name: Job budget
        if: always()
        shell: bash
        run: ./scripts/CI/JobBudget.sh "${{ github.job }}" "$JOB_START"

  windows-release-tests:
    name: Windows Release tests ${{ matrix.shard }}/1
    needs: [ windows-release ]
    runs-on: windows-2022
    # Release ran all 354 suites in 2.4 min in run #900.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Release]
        shard: [1]
    steps: *windows-test-steps

  windows-debug-verdict:
    name: Windows Debug
    needs: [ windows-debug, windows-debug-tests ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # env, not a one-entry matrix: a matrix job whose name has no matrix expression gets its values
    # appended, and this name must stay exactly the check name the unsharded job had.
    env:
      ARTIFACT: windows-Debug
    steps: *test-verdict-steps

  windows-release-verdict:
    name: Windows Release
    needs: [ windows-release, windows-release-tests ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # env, not a one-entry matrix: a matrix job whose name has no matrix expression gets its values
    # appended, and this name must stay exactly the check name the unsharded job had.
    env:
      ARTIFACT: windows-Release
    steps: *test-verdict-steps
